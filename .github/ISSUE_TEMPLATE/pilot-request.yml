name: Community interest request
description: Join the list for a future MineX community website pilot.
title: "[Community interest] "
body:
  - type: markdown
    attributes:
      value: |
        This is a public expression of interest. Community gameplay is not available from this package yet.
        You do not need a VPS or domain to sign up. Do not include passwords, private contact details, VPS access, or player data.
  - type: input
    id: community
    attributes:
      label: Public community name
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What would you like to try with MineX?
    validations:
      required: true
  - type: input
    id: public_domain
    attributes:
      label: Public website or proposed domain (optional)
      description: A purchased domain or VPS is not needed to express interest.
  - type: input
    id: region
    attributes:
      label: Region and preferred languages (optional)
  - type: dropdown
    id: group_size
    attributes:
      label: Approximate group size (optional)
      options:
        - Up to 10 players
        - 11–50 players
        - More than 50 players
        - Not decided yet
  - type: dropdown
    id: machine
    attributes:
      label: Test machine availability
      options:
        - I will start with the local preview
        - I already have a spare VPS
        - I would need to arrange a VPS later
