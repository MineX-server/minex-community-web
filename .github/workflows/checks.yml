name: Public package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-package:
    name: Public package checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check public file inventory and content
        run: python3 tools/check_public.py
      - name: Run local tests
        run: python3 -m unittest discover -s tests -v
